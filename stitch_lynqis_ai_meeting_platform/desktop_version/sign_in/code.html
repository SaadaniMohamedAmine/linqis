<body class="flex items-center justify-center min-h-screen relative overflow-hidden bg-[#0A0A0A]">
<!-- Atmospheric Ambient Background -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-secondary/5 rounded-full blur-[160px]"></div>
</div>
<!-- Main Content Shell -->
<main class="z-10 w-full max-w-[420px] px-md">
<!-- Brand Identity Section (Suppressed Shell as per mandate) -->
<div class="flex flex-col items-center mb-xl">
<div class="w-12 h-12 bg-primary-container rounded-lg flex items-center justify-center mb-md border border-primary/20">
<span class="material-symbols-outlined text-on-primary-container text-headline-md" style="font-variation-settings: 'FILL' 1;">sync_alt</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">Lynqis</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-xs">AI-driven meeting intelligence</p>
</div>
<!-- Auth Card -->
<div class="glass-card rounded-xl p-lg flex flex-col gap-lg shadow-[0_1px_2px_rgba(0,0,0,0.5)]">
<div class="flex flex-col gap-xs">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Welcome back</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Sign in to access your meeting insights.</p>
</div>
<!-- Social Login -->
<button class="flex items-center justify-center gap-md w-full h-[48px] bg-transparent border border-outline-variant hover:border-outline text-on-surface font-label-md text-label-md rounded-lg transition-all active:scale-[0.98]">
<svg height="18" viewbox="0 0 18 18" width="18">
<path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"></path>
<path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"></path>
<path d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.173 0 7.548 0 9s.347 2.827.957 4.039l3.007-2.332z" fill="#FBBC05"></path>
<path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z" fill="#EA4335"></path>
</svg>
<span>Continue with Google</span>
</button>
<!-- Divider -->
<div class="flex items-center gap-md">
<div class="h-[1px] flex-1 bg-outline-variant"></div>
<span class="text-[10px] font-bold text-outline uppercase tracking-widest">OR</span>
<div class="h-[1px] flex-1 bg-outline-variant"></div>
</div>
<!-- Credentials Form -->
<form class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-xs">Email address</label>
<input class="w-full h-[44px] bg-[#0A0A0A] border border-outline-variant rounded-lg px-md text-on-surface font-body-sm text-body-sm focus:outline-none focus:border-primary input-glow transition-all" placeholder="name@company.com" type="email"/>
</div>
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center px-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline transition-all" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="w-full h-[44px] bg-[#0A0A0A] border border-outline-variant rounded-lg px-md text-on-surface font-body-sm text-body-sm focus:outline-none focus:border-primary input-glow transition-all" placeholder="••••••••" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface" type="button">
<span class="material-symbols-outlined text-[18px]">visibility</span>
</button>
</div>
</div>
<button class="w-full h-[48px] bg-[#16A34A] hover:bg-[#15803d] text-on-primary font-label-md text-label-md rounded-lg transition-all active:scale-[0.98] mt-base shadow-sm" type="submit">
                    Sign In
                </button>
</form>
</div>
<!-- Footer Links -->
<div class="mt-xl text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Don't have an account? 
                <a class="text-primary font-label-md text-label-md hover:underline ml-xs" href="#">Sign up</a>
</p>
</div>
</main>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.querySelector('form');
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const btn = form.querySelector('button[type="submit"]');
                const originalText = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>';
                
                // Simulation of loading state
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }, 2000);
            });

            // Password visibility toggle
            const toggleBtn = document.querySelector('.relative button');
            const passwordInput = document.querySelector('input[type="password"]');
            toggleBtn.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                toggleBtn.querySelector('span').innerText = isPassword ? 'visibility_off' : 'visibility';
            });
        });
    </script>
</body></html>
