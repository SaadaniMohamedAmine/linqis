<script>
        document.addEventListener('mousemove', (e) => {
            const glitch = document.querySelector('.glitch-line');
            if (glitch) {
                // Randomize glitch speed or opacity slightly on mouse move for "atmospheric interference"
                if (Math.random() > 0.95) {
                    glitch.style.opacity = Math.random().toString();
                }
            }
        });

        // Simple animation trigger for the 404 text
        const text = document.querySelector('.glitch-text');
        if (text) {
            setInterval(() => {
                text.style.transform = `translate(${Math.random() * 2 - 1}px, ${Math.random() * 2 - 1}px)`;
                setTimeout(() => {
                    text.style.transform = 'translate(0,0)';
                }, 50);
            }, 3000);
        }
