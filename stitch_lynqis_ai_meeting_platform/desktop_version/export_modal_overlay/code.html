<!-- Export Modal Overlay -->
<div class="fixed inset-0 z-50 glass-overlay flex items-center justify-center p-md">

<div class="p-lg flex flex-col gap-lg">
<!-- Notion Option -->
<div class="flex flex-col gap-sm">
<label class="flex items-center gap-sm cursor-pointer group">
<input checked="" class="w-5 h-5 text-primary border-outline-variant bg-surface-container focus:ring-0 focus:ring-offset-0" name="export-target" type="radio"/>
<div class="flex items-center gap-xs flex-1">

</div>
<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-surface-container-low text-on-surface-variant border border-outline-variant">CONNECTED</span>
</label>

<div class="relative">
<select class="w-full bg-background border border-outline-variant rounded-lg py-base px-md font-body-sm text-body-sm text-on-surface outline-none appearance-none input-glow cursor-pointer">

<option>Engineering Wiki</option>
<option>Product Roadmap</option>
<option>New Page...</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
</div>
<!-- Slack Option -->
<div class="flex flex-col gap-sm">
<label class="flex items-center gap-sm cursor-pointer group">
<input class="w-5 h-5 text-primary border-outline-variant bg-surface-container focus:ring-0 focus:ring-offset-0" name="export-target" type="radio"/>

</div>
</label>

<select class="w-full bg-background border border-outline-variant rounded-lg py-base px-md font-body-sm text-body-sm text-on-surface outline-none appearance-none input-glow cursor-pointer disabled:opacity-50" disabled="">
<option>#general</option>
<option>#product-updates</option>
<option>#meeting-summaries</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant opacity-50">expand_more</span>
</div>
</div>
</div>

<span class="font-label-md text-label-md text-on-surface">Email Recap</span>
</div>
</label>

<input class="w-full bg-background border border-outline-variant rounded-lg py-base px-md font-body-sm text-body-sm text-on-surface outline-none input-glow disabled:opacity-50" disabled="" placeholder="Enter recipient email..." type="email"/>
</div>

<button class="flex-1 border border-outline-variant text-on-surface font-label-md text-label-md py-md rounded-lg hover:bg-surface-container transition-all active:scale-[0.98]">
          Cancel
        </button>
<button class="flex-1 bg-primary text-on-primary font-label-md text-label-md py-md rounded-lg hover:opacity-90 transition-all active:scale-[0.98] shadow-[0_1px_2px_rgba(0,0,0,0.5)]">
          Export Now
        </button>
</div>
</div>
</div>
<script>
    // Simple micro-interaction for radio buttons
    const radios = document.querySelectorAll('input[type="radio"]');
    radios.forEach(radio => {
      radio.addEventListener('change', (e) => {
        // Find all sibling pickers and disable them
        const allPickers = document.querySelectorAll('select, input[type="email"]');
        allPickers.forEach(p => {
          p.disabled = true;
          p.parentElement.classList.add('opacity-50');
        });

        // Enable the picker belonging to this radio's parent's sibling
        const currentPickerContainer = radio.closest('.flex-col').querySelector('.ml-8');
        const currentPicker = currentPickerContainer.querySelector('select, input[type="email"]');
        if (currentPicker) {
          currentPicker.disabled = false;
          currentPickerContainer.classList.remove('opacity-50');
        }
      });
    });

    // Initial state check for opacity
    document.querySelectorAll('.flex-col').forEach(container => {
      const radio = container.querySelector('input[type="radio"]');
      const pickerContainer = container.querySelector('.ml-8');
      if (radio && pickerContainer && !radio.checked) {
        pickerContainer.classList.add('opacity-50');
      }
    });
  </script>
